<div class="container">
  <h1> My Family appointment Applicaion </h1>

    <div class="mb-3">
  <label class="form-label" >Email Title</label>
  <input [(ngModel)]="newappointmentTitle" class="form-control" placeholder="Enter a title">
</div>
<div class="mb-3">
  <label class="form-label">Select Date</label>
  <input type="date" class="form-control" [(ngModel)]="newappointmentDate" placeholder="Please select a Date">
</div>
<button class="btn btn-primary btn-sm w-20" *ngIf="selectedIndex == null" (click)="Add()">Add</button>&nbsp;
<button class="btn btn-primary btn-sm w-20" *ngIf="selectedIndex != null" (click)="update()">Update</button>
</div>

<div class="container mt-4">

  <table class="table table-striped table-bordered table-hover">
    <thead class="table-primary">
      <tr>
        <th>#</th>
        <th>Title</th>
        <th>Date</th>
        <th style="width: 100px;">Action</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let appointment of appointments; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ appointment.title }}</td>
        <td>{{ appointment.date }}</td>
        <td>
          <button class="btn btn-primary btn-sm w-100"  (click)="EditAppointment(appointment,i)">
            Edit
          </button> &nbsp;
          <button class="btn btn-danger btn-sm w-100" (click)="Remove(i)">
            Delete
          </button>
        </td>
      </tr>
    </tbody>
  </table>

</div>
